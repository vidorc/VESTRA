services:
  mongodb:
    image: mongo:7
    container_name: vestra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vestra-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vestra-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Intentional override: the compose stack runs its own mongodb service
      # above, so we point at it instead of the Atlas URI in .env. Remove this
      # line to use the .env MONGODB_URI (e.g. Atlas) instead of local Mongo.
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: vestra
      # Auth/security — required at startup. Provide via .env or shell env.
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-static}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  mongodb_data:
