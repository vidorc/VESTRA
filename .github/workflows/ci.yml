name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the deploy target (Dockerfile uses python:3.11-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Test with coverage
        # Tests are hermetic: conftest.py sets dummy env, Mongo is mongomock,
        # and the LLM is injected via the set_llm seam. No real secrets needed.
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70
